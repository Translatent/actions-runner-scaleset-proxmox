name: ci-failure-report

on:
  workflow_run:
    workflows:
      - "CI"
      - "Release"
    types: [completed]
    branches: [main, ci-failure-report-e2e]
permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'ci-failure-report'
    # This public repository cannot call the reporter in the private deploy-config
    # repository, so its local fork must remain contract-compatible with upstream.
    uses: ./.github/workflows/report-ci-failure.yml
    with:
      repo: ${{ github.repository }}
      workflow_name: ${{ github.event.workflow_run.name }}
      run_id: ${{ github.event.workflow_run.id }}
      run_url: ${{ github.event.workflow_run.html_url }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
      trigger_event: ${{ github.event.workflow_run.event }}
      display_title: ${{ github.event.workflow_run.display_title }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      FORGE_ANOMALY_TOKEN: ${{ secrets.FORGE_ANOMALY_TOKEN }}
