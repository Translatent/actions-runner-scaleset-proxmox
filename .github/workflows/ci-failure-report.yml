name: ci-failure-report

on:
  workflow_run:
    workflows:
      - "CI"
      - "Release"
    types: [completed]
    branches: [main, ci-failure-report-e2e]
  schedule:
    - cron: "22 7 * * *"
  workflow_dispatch:
    inputs:
      self_test_failure:
        description: Deliberately fail the credential probe and exercise the durable issue path.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'ci-failure-report'
    uses: ./.github/workflows/report-ci-failure.yml
    with:
      repo: ${{ github.repository }}
      workflow_name: ${{ github.event.workflow_run.name }}
      run_id: ${{ github.event.workflow_run.id }}
      run_url: ${{ github.event.workflow_run.html_url }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
    secrets:
      FORGE_ANOMALY_TOKEN: ${{ secrets.FORGE_ANOMALY_TOKEN }}

  health:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/check-ci-failure-reporter.yml
    with:
      force_failure: ${{ inputs.self_test_failure || false }}
    secrets:
      FORGE_ANOMALY_TOKEN: ${{ secrets.FORGE_ANOMALY_TOKEN }}
